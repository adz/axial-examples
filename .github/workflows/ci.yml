name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build
      - name: Smoke check reference app
        run: dotnet run --project examples/Axial.ReferenceApp/Axial.ReferenceApp.fsproj --no-build -- list
      - name: Smoke check ASP.NET Core example
        run: AXIAL_EXAMPLE=smoke dotnet run --project examples/Axial.Hosting.AspNetCore.Example/Axial.Hosting.AspNetCore.Example.fsproj --no-build
      - name: Smoke check GenHTTP example
        run: AXIAL_EXAMPLE=smoke dotnet run --project examples/Axial.Hosting.GenHttp.Example/Axial.Hosting.GenHttp.Example.fsproj --no-build
